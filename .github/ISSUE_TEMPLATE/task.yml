
name: Task
description: Create a task for the Graph Quest project
title: "[TASK] "
body:
  - type: markdown
    attributes:
      value: |
        Use this form to describe a development task.

  - type: input
    id: summary
    attributes:
      label: Task summary
      description: Briefly describe the task.
      placeholder: Implement graph management
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Task description
      description: Explain what needs to be done.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List the conditions for completing this task.
      placeholder: |
        - [ ] Feature works correctly
        - [ ] Tests pass
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Low
        - Medium
        - High
    validations:
      required: true

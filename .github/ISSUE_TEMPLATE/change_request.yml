
name: Change Request
description: Propose a change or improvement to Graph Quest
title: "[CHANGE] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Use this form to propose a new feature or improve an existing one.

  - type: input
    id: summary
    attributes:
      label: Change summary
      description: Briefly describe the proposed change.
      placeholder: Improve shortest path visualization
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this change solve?
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed solution
      description: Explain your suggested solution.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Expected impact
      description: How will this change improve Graph Quest?
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Low
        - Medium
        - High
    validations:
      required: true
